# Uses the prebuilt images published by GitHub Actions on ghcr.io.
# To build locally instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  # Not published: the frontend proxies /api and /ws to it over the compose network,
  # by this service name (wayfinderr-backend)
  wayfinderr-backend:
    image: ${WAYFINDERR_REGISTRY:-ghcr.io/tehmaat}/wayfinderr-backend:${WAYFINDERR_TAG:-latest}
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/wayfinderr.db
      - WATCH_DIR=/makemkv-output
      - WATCH_USE_POLLING=${WATCH_USE_POLLING:-false}
      - MAX_CONCURRENT_UPLOADS=${MAX_CONCURRENT_UPLOADS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Log history on disk (/app/data/logs, the Logs page): days kept (0: forever) and
      # the most space it takes in MB (0: no limit); the oldest days go first
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-500}
      # Optional: fixed code for creating the account (otherwise printed in the log)
      - WAYFINDERR_SETUP_CODE=${WAYFINDERR_SETUP_CODE:-}
      - DELETE_AFTER_UPLOAD=${DELETE_AFTER_UPLOAD:-false}
      # Automatic ripping of film discs from the downloads folder (needs the makemkv service)
      - RIP_ENABLED=${RIP_ENABLED:-false}
      - RIP_SOURCE_DIR=/downloads
      - RIP_EXISTING=${RIP_EXISTING:-false}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-it-IT}
      - RIP_QUIET_MINUTES=${RIP_QUIET_MINUTES:-10}
      - RIP_MIN_LENGTH=${RIP_MIN_LENGTH:-2700}
      - RIP_LANGUAGE=${RIP_LANGUAGE:-it}
      # Merge two rips of a film (better video + Italian audio) with Dyadrr (needs the dyadrr service)
      - MERGE_ENABLED=${MERGE_ENABLED:-false}
    # Lets the backend reach qBittorrent on this machine as http://host.docker.internal:8080
    # (built into Docker Desktop, needed on Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Folder where MakeMKV saves the .mkv files (set MAKEMKV_OUTPUT_DIR in .env).
      # Writable: rips are moved in, uploaded files deleted (DELETE_AFTER_UPLOAD)
      - ${MAKEMKV_OUTPUT_DIR:-./makemkv-output}:/makemkv-output
      # Downloads with the discs to rip (ISO, BDMV, VIDEO_TS) and RAR archives, read only...
      - ${DOWNLOADS_DIR:-./downloads}:/downloads:ro
      # ...but for Wayfinderr's own folder in them: a RAR archive is unpacked there when the
      # downloads disk has more free space than the watch folder's (without this line, only
      # next to the watch folder)
      - ${DOWNLOADS_DIR:-./downloads}/.wayfinderr:/downloads/.wayfinderr
      - wayfinderr-data:/app/data
    restart: unless-stopped
    networks:
      - wayfinderr

  wayfinderr-frontend:
    image: ${WAYFINDERR_REGISTRY:-ghcr.io/tehmaat}/wayfinderr-frontend:${WAYFINDERR_TAG:-latest}
    ports:
      - "3000:3000"
    depends_on:
      - wayfinderr-backend
    restart: unless-stopped
    networks:
      - wayfinderr

  # Optional: MakeMKV in Docker (jlesage/makemkv plus the runner that does the
  # automatic rips). Start it with: docker compose --profile makemkv up -d
  makemkv:
    image: ${WAYFINDERR_REGISTRY:-ghcr.io/tehmaat}/wayfinderr-makemkv:${WAYFINDERR_TAG:-latest}
    profiles: ["makemkv"]
    ports:
      - "5800:5800"
    environment:
      # Purchased key, or BETA for the free beta key
      - MAKEMKV_KEY=${MAKEMKV_KEY:-BETA}
      - WAYFINDERR_RUNNER=${WAYFINDERR_RUNNER:-1}
      - WAYFINDERR_CACHE_MB=${WAYFINDERR_CACHE_MB:-1024}
    volumes:
      - makemkv-config:/config
      - ${MAKEMKV_OUTPUT_DIR:-./makemkv-output}:/output
      - ${DOWNLOADS_DIR:-./downloads}:/storage:ro
    # devices:
    #   - /dev/sr0:/dev/sr0
    #   - /dev/sg0:/dev/sg0
    restart: unless-stopped
    networks:
      - wayfinderr

  # Optional: Dyadrr, which merges the Italian audio of one rip into the better video
  # of another without re-encoding (MERGE_ENABLED). Start it with:
  # docker compose --profile merge up -d
  dyadrr:
    image: ${DYADRR_REGISTRY:-ghcr.io/tehmaat}/dyadrr:${DYADRR_TAG:-latest}
    profiles: ["merge"]
    # Fixed: Dyadrr knows its own temporary files by host name, so a job stopped
    # abruptly is cleaned up by the next one only if the name stays the same
    hostname: dyadrr
    # A running job is cancelled cleanly on docker stop
    stop_grace_period: 30s
    volumes:
      # The watch folder, writable: the jobs (.wayfinderr/dyadrr/jobs), the files to merge,
      # the merged film and Dyadrr's temporary files (on the same disk as the merged film)
      - ${MAKEMKV_OUTPUT_DIR:-./makemkv-output}:/data/watch
      # The downloads, read only: an .mkv there can be merged too
      - ${DOWNLOADS_DIR:-./downloads}:/data/downloads:ro
    restart: unless-stopped
    networks:
      - wayfinderr

volumes:
  wayfinderr-data:
  makemkv-config:

networks:
  wayfinderr:
    driver: bridge
