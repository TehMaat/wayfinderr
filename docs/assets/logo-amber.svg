<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Wayfinderr">
  <title>Wayfinderr</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#261c0e"/>
      <stop offset="1" stop-color="#0e0a06"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309" stop-opacity=".55"/>
      <stop offset="1" stop-color="#451a03" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#fef3c7"/>
      <stop offset=".55" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g transform="translate(14 13)">
    <!-- back edge, seen through the glass -->
    <path d="M6 76 L94 76" stroke="#fbbf24" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 4"/>
    <!-- glass faces -->
    <path d="M50 4 L6 76 L46 98 Z" fill="url(#left)"/>
    <path d="M50 4 L46 98 L94 76 Z" fill="url(#right)"/>
    <!-- inner star lines -->
    <path d="M48 62 L50 4 M48 62 L6 76 M48 62 L94 76 M48 62 L46 98" stroke="#fde68a" stroke-opacity=".35" stroke-width="1"/>
    <!-- core -->
    <circle cx="48" cy="62" r="20" fill="url(#core)"/>
    <circle cx="48" cy="62" r="3.5" fill="#fff"/>
    <!-- frame -->
    <path d="M50 4 L6 76 L46 98 L94 76 Z M50 4 L46 98" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linejoin="round"/>
    <!-- vertex nodes -->
    <g fill="#fef3c7">
      <circle cx="50" cy="4" r="4"/>
      <circle cx="6" cy="76" r="4"/>
      <circle cx="94" cy="76" r="4"/>
      <circle cx="46" cy="98" r="4"/>
    </g>
  </g>
</svg>
