<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Wayfinderr architecture</title>
  <desc id="d">The browser talks only to the frontend, over HTTP on the LAN, over HTTPS served by the frontend itself (optional), or through a reverse proxy; the frontend proxies the API and the WebSocket to the backend. The backend keeps its data in SQLite, watches the watch folder, exchanges job files with the MakeMKV and Dyadrr containers through it, uploads over SFTP to the servers, talks to qBittorrent and TMDB, and can fetch the HTTPS wildcard from the Pangolin host over SSH.</desc>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8b5cf6; stroke-width: 1.5; }
    .ext { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .opt { fill: #ffffff; stroke: #8b5cf6; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub { fill: #57606a; font-size: 12px; }
    .zlabel { fill: #57606a; font-size: 12px; font-weight: 600; letter-spacing: .06em; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .elabel { fill: #57606a; font-size: 11.5px; }
    .arrow { fill: #57606a; }
    .accent { fill: #8b5cf6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .zone { fill: #161b22; stroke: #30363d; }
      .box, .ext, .opt { fill: #0d1117; }
      .box, .opt { stroke: #a78bfa; }
      .ext { stroke: #8b949e; }
      .title { fill: #e6edf3; }
      .sub, .zlabel, .elabel { fill: #8b949e; }
      .edge { stroke: #8b949e; }
      .arrow { fill: #8b949e; }
      .accent { fill: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrow"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600" rx="12"/>

  <!-- Browser -->
  <rect class="ext" x="350" y="24" width="260" height="58" rx="10"/>
  <text class="title" x="480" y="49" text-anchor="middle">Browser</text>
  <text class="sub" x="480" y="68" text-anchor="middle">LAN, or HTTPS: built in or a reverse proxy</text>

  <!-- Docker host zone -->
  <rect class="zone" x="24" y="118" width="912" height="300" rx="12"/>
  <text class="zlabel" x="44" y="142">DOCKER HOST (OR THIS PC, WITHOUT DOCKER)</text>

  <!-- Frontend -->
  <rect class="box" x="60" y="166" width="230" height="84" rx="10"/>
  <text class="title" x="175" y="194" text-anchor="middle">Frontend</text>
  <text class="sub" x="175" y="214" text-anchor="middle">Next.js · 3000 · HTTPS 443 optional</text>
  <text class="sub" x="175" y="232" text-anchor="middle">pages + proxy /api, /ws</text>

  <!-- Backend -->
  <rect class="box" x="365" y="166" width="230" height="84" rx="10"/>
  <text class="title" x="480" y="194" text-anchor="middle">Backend</text>
  <text class="sub" x="480" y="214" text-anchor="middle">Express · port 3001</text>
  <text class="sub" x="480" y="232" text-anchor="middle">watcher, queue, ripper</text>

  <!-- SQLite -->
  <rect class="box" x="670" y="166" width="230" height="84" rx="10"/>
  <text class="title" x="785" y="194" text-anchor="middle">SQLite</text>
  <text class="sub" x="785" y="214" text-anchor="middle">Prisma · data volume</text>
  <text class="sub" x="785" y="232" text-anchor="middle">uploads, rips, servers, login</text>

  <!-- Watch folder -->
  <rect class="box" x="365" y="300" width="230" height="84" rx="10"/>
  <text class="title" x="480" y="328" text-anchor="middle">Watch folder</text>
  <text class="sub" x="480" y="348" text-anchor="middle">the .mkv files</text>
  <text class="sub" x="480" y="366" text-anchor="middle">+ .wayfinderr/ job files</text>

  <!-- MakeMKV -->
  <rect class="opt" x="60" y="300" width="230" height="84" rx="10"/>
  <text class="title" x="175" y="328" text-anchor="middle">MakeMKV container</text>
  <text class="sub" x="175" y="348" text-anchor="middle">optional · rips the discs</text>
  <text class="sub" x="175" y="366" text-anchor="middle">GUI on port 5800</text>

  <!-- Dyadrr -->
  <rect class="opt" x="670" y="300" width="230" height="84" rx="10"/>
  <text class="title" x="785" y="328" text-anchor="middle">Dyadrr container</text>
  <text class="sub" x="785" y="348" text-anchor="middle">optional · merges</text>
  <text class="sub" x="785" y="366" text-anchor="middle">two rips of a film</text>

  <!-- Outside -->
  <text class="zlabel" x="44" y="454">ON THE NETWORK</text>
  <rect class="ext" x="30" y="472" width="210" height="84" rx="10"/>
  <text class="title" x="135" y="500" text-anchor="middle">Upload servers</text>
  <text class="sub" x="135" y="520" text-anchor="middle">Ultra.cc, seedboxes, SSH</text>
  <text class="sub" x="135" y="538" text-anchor="middle">SFTP · space via API or SSH</text>

  <rect class="ext" x="255" y="472" width="210" height="84" rx="10"/>
  <text class="title" x="360" y="500" text-anchor="middle">qBittorrent</text>
  <text class="sub" x="360" y="520" text-anchor="middle">WebUI API · downloads</text>
  <text class="sub" x="360" y="538" text-anchor="middle">cleanup, local release</text>

  <rect class="ext" x="480" y="472" width="210" height="84" rx="10"/>
  <text class="title" x="585" y="500" text-anchor="middle">TMDB</text>
  <text class="sub" x="585" y="520" text-anchor="middle">film titles in every language</text>
  <text class="sub" x="585" y="538" text-anchor="middle">file names, name matching</text>

  <rect class="ext" x="705" y="472" width="210" height="84" rx="10"/>
  <text class="title" x="810" y="500" text-anchor="middle">Pangolin host</text>
  <text class="sub" x="810" y="520" text-anchor="middle">optional · SSH, one command</text>
  <text class="sub" x="810" y="538" text-anchor="middle">the wildcard for HTTPS</text>

  <!-- Edges -->
  <path class="edge" d="M410 82 C 330 110, 230 130, 190 164" marker-end="url(#a)"/>
  <text class="elabel" x="120" y="104">pages, /api, /ws (HTTP or HTTPS)</text>

  <path class="edge" d="M290 208 L 363 208" marker-end="url(#a)"/>
  <text class="elabel" x="300" y="200">proxy</text>

  <path class="edge" d="M595 208 L 668 208" marker-end="url(#a)" marker-start="url(#a)"/>

  <path class="edge" d="M480 250 L 480 298" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="elabel" x="488" y="280">watches</text>

  <path class="edge" d="M290 342 L 363 342" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="elabel" x="322" y="334">jobs</text>

  <path class="edge" d="M668 342 L 597 342" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="elabel" x="608" y="334">jobs</text>

  <path class="edge" d="M365 236 H 308 V 440 H 135 V 470" marker-end="url(#a)"/>
  <text class="elabel" x="200" y="432">SFTP upload</text>

  <path class="edge" d="M595 236 H 652 V 440 H 360 V 470" marker-end="url(#a)"/>
  <path class="edge" d="M585 440 V 470" marker-end="url(#a)"/>
  <path class="edge" d="M652 440 H 810 V 470" marker-end="url(#a)"/>
  <text class="elabel" x="662" y="432">HTTP APIs · SSH (certificate)</text>
</svg>
